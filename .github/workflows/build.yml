name: Build and publish Satin Alibi

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 10 * * *"   # 6:15am Toronto (EDT): releases scheduled posts and pins
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build site and render pins
        run: python build.py --pins

      - name: Add Cloudflare config (works for both Pages and Workers deploys)
        run: |
          cat > dist/wrangler.jsonc <<'EOF'
          {
            "name": "satinalibi",
            "compatibility_date": "2026-09-01",
            "assets": { "directory": ".", "not_found_handling": "404-page" }
          }
          EOF
          printf "wrangler.jsonc\n.assetsignore\n.git\n" > dist/.assetsignore

      - name: Publish to the site branch (Cloudflare serves this branch)
        run: |
          cd dist
          git init -q
          git checkout -q -b site
          git config user.name "Satin Alibi bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
