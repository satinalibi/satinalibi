<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>walk-in-like-you-were-expected-2</title>
<style>
@font-face{font-family:"IS";src:url(/fonts/InstrumentSerif.woff) format("woff");font-style:normal}
@font-face{font-family:"IS";src:url(/fonts/InstrumentSerif-Italic.woff) format("woff");font-style:italic}
@font-face{font-family:"ISans";src:url(/fonts/InstrumentSans.woff) format("woff");font-weight:400 700}
@font-face{font-family:"CP";src:url(/fonts/CourierPrime.woff) format("woff");font-style:normal}
@font-face{font-family:"CP";src:url(/fonts/CourierPrime-Italic.woff) format("woff");font-style:italic}
@font-face{font-family:"HA";src:url(/fonts/HomemadeApple.woff) format("woff")}
@font-face{font-family:"PF";src:url(/fonts/PlayfairDisplay-ExtraBold.woff) format("woff");font-weight:800;font-style:normal}
@font-face{font-family:"PF";src:url(/fonts/PlayfairDisplay-ExtraBoldItalic.woff) format("woff");font-weight:800;font-style:italic}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:1500px;overflow:hidden}
body{font-family:"ISans",sans-serif;-webkit-font-smoothing:antialiased}
.pin{width:1000px;height:1500px;position:relative;overflow:hidden}
.ph{background:#2a211d center/cover no-repeat;position:relative}
.ph.bw{filter:grayscale(1) contrast(1.08) brightness(.96)}
.ph.warm::after{content:"";position:absolute;inset:0;background:#e9c49a;mix-blend-mode:soft-light;opacity:.35}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:overlay;z-index:20;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.mono{font-family:"CP",monospace;font-size:23px;letter-spacing:.2em;text-transform:uppercase;line-height:1.35}
.hand{font-family:"HA",cursive;color:#9E1B25;font-size:44px;line-height:1.2}
.disp{font-family:"IS",serif;font-weight:400;letter-spacing:-.02em;line-height:.9}
.disp i{font-style:italic}
.sub{font-family:"ISans",sans-serif;font-style:italic;font-weight:500;font-size:var(--sub-size,56px);line-height:1.28;text-align:center;
  color:var(--sub-color,#fff);
  text-shadow:0 0 2px #000,0 0 2px #000,0 2px 3px #000,0 0 18px rgba(0,0,0,.55)}
.row{display:flex;justify-content:space-between;align-items:center}

/* STILL: one film still with subtitles, letterboxed */
.still{background:#0c0a09;display:flex;flex-direction:column;color:#EDE4D8}
.still .bar{height:150px;padding:0 64px}
.still .ph{flex:1}
.still .ph .sub{position:absolute;left:56px;right:56px;bottom:64px}
.still .foot{min-height:300px;padding:44px 64px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.still .foot .disp{font-size:var(--size,104px);color:#F4EFE8}
.still .foot .disp i{color:#E9CFC6}

/* FRAMES: stacked stills, the subtitle carries across */
.frames{background:#0c0a09;color:#EDE4D8;padding:64px 50px 56px;display:flex;flex-direction:column;justify-content:space-between}
.frames .stack{display:flex;flex-direction:column;gap:26px}
.frames .ph{height:var(--frame-h,600px)}
.frames .ph .sub{position:absolute;left:40px;right:40px;bottom:30px}

/* MOODBOARD: scrapbook collage on paper */
.board{background:#F2ECE3;color:#16110F}
.board .card{position:absolute;background-color:#2a211d;border:12px solid #FBF8F3;box-shadow:0 18px 40px rgba(40,25,15,.28)}
.board .tape{position:absolute;width:150px;height:44px;background:rgba(232,214,178,.78);z-index:5}
.board .title{position:absolute;left:64px;right:64px;bottom:68px;z-index:6}
.board .title .disp{font-size:var(--size,168px)}
.board .title .disp i{color:#9E1B25}
.board .note{position:absolute;right:70px;bottom:410px;transform:rotate(-6deg);z-index:7}

/* COVER: magazine cover. Title sits in its own band so it never covers a face */
.cover{background:#F2ECE3;color:#16110F;display:flex;flex-direction:column}
.cover .top{padding:52px 60px 0}
.cover .top .row{font-size:20px;color:#6E5A4B;border-bottom:2px solid #D9CBB9;padding-bottom:16px}
.cover .mast{font-size:calc(var(--size,250px) * .62);line-height:.86;text-align:center;margin:30px 0 30px}
.cover .mast i{display:block;color:#9E1B25}
.cover .ph{flex:1}
.cover .foot{padding:24px 60px 34px;font-size:20px;color:#6E5A4B;gap:30px}
.cover .foot span:first-child{font-size:17px;letter-spacing:.1em}
/* EDIT: shoppable grid */
.edit{background:#F2ECE3;color:#16110F;padding:64px 60px 58px;display:flex;flex-direction:column;justify-content:space-between}
.edit .head .disp{font-size:var(--size,136px);margin-top:18px}
.edit .head .disp i{color:#9E1B25}
.edit .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 22px}
.edit .grid .ph{height:380px}
.edit .lab{margin-top:12px;font-size:25px;letter-spacing:.12em}
</style></head>
<body>





<div class="pin frames">
  <div class="row mono"><span>Satin Alibi</span><span>Take Up Space</span></div>
  <div class="stack">
  
    <div class="ph bw" style="background-image:url('https://images.unsplash.com/photo-1633355130553-2d90ad3507d3?auto=format&amp;fit=crop&amp;crop=faces,entropy&amp;w=900&amp;q=80&amp;h=600')"><p class="sub">You didn&#39;t enter the room.</p></div>
  
    <div class="ph bw" style="background-image:url('https://images.unsplash.com/photo-1540172777610-b15b605dd68d?auto=format&amp;fit=crop&amp;crop=faces,entropy&amp;w=900&amp;q=80&amp;h=600')"><p class="sub">You arrived.</p></div>
  
  </div>
  <div class="row mono" style="font-size:20px;color:#B8A898"><span>take up space</span><span>satinalibi.com</span></div>
  <div class="grain"></div>
</div>

</body></html>
